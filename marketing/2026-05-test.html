<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f5f5f7; }
    h1 { color: #1c1c1e; }
    .card { background: #fff; border-radius: 12px; padding: 24px; margin-top: 20px; }
  </style>
<style>
  #pw-gate { position:fixed;inset:0;z-index:9999;background:#f5f5f7;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'DM Sans',system-ui,sans-serif; }
  #pw-gate.hidden{display:none}
  #pw-box{background:#fff;border:1px solid #e5e5ea;border-radius:12px;padding:36px 40px;width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  #pw-logo{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8e8e93;margin-bottom:18px}
  #pw-title{font-size:15px;font-weight:600;color:#1c1c1e;margin-bottom:6px}
  #pw-sub{font-size:12px;color:#8e8e93;margin-bottom:22px}
  #pw-input{width:100%;padding:10px 12px;font-size:13px;border:1px solid #e5e5ea;border-radius:8px;background:#f5f5f7;color:#1c1c1e;outline:none;margin-bottom:12px;box-sizing:border-box;transition:border-color .15s}
  #pw-input:focus{border-color:#636366}
  #pw-input.pw-error{border-color:#ff3b30}
  #pw-btn{width:100%;padding:10px;font-size:13px;font-weight:600;background:#1c1c1e;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s}
  #pw-btn:hover{opacity:.82}
  #pw-err{font-size:11px;color:#ff3b30;margin-top:10px;min-height:16px}
</style>
</head>
<body><div id="pw-gate"><div id="pw-box">
  <div id="pw-logo">Devoted Reports</div>
  <div id="pw-title">Test Dashboard — May 2026</div>
  <div id="pw-sub">This report is confidential.</div>
  <input id="pw-input" type="password" placeholder="Password" autocomplete="current-password"/>
  <button id="pw-btn">Unlock</button>
  <div id="pw-err"></div>
</div></div>
  <h1>Test Dashboard — Devoted Reports</h1>
  <div class="card">
    <p>Це тестовий дашборд. Якщо ти бачиш цю сторінку — система працює!</p>
  </div>
<script>
(function(){
  var HASH='492203c21d50e6ef9554944a646d7822ec2895e803e26ea13a9f16f3e808ed6e',gate=document.getElementById('pw-gate'),input=document.getElementById('pw-input'),btn=document.getElementById('pw-btn'),err=document.getElementById('pw-err');
  if(sessionStorage.getItem('dr_unlocked')==='1'){gate.classList.add('hidden');return;}
  function sha256(s){var b=new TextEncoder().encode(s);return crypto.subtle.digest('SHA-256',b).then(function(h){return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  function attempt(){var v=input.value;if(!v)return;sha256(v).then(function(d){if(d===HASH){sessionStorage.setItem('dr_unlocked','1');gate.classList.add('hidden')}else{input.classList.add('pw-error');err.textContent='Incorrect password.';input.value='';input.focus()}})}
  btn.addEventListener('click',attempt);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();input.classList.remove('pw-error');err.textContent=''});
  input.focus();
})();
</script>
</body>
</html>
